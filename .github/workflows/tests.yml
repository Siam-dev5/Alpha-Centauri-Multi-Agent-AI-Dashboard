name: Gateway Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q openbot_server.py tests
      - name: Run tests
        run: pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Meta Worker and dashboard JavaScript
        run: node --test tests/activity_log.test.mjs tests/meta_worker.test.mjs tests/index_inline_scripts.test.mjs tests/dashboard_route.test.mjs tests/facebook_publish.test.mjs tests/chat_facebook_command.test.mjs tests/auto_like.test.mjs tests/workflow.test.mjs tests/tiktok_oauth.test.mjs
      - name: Build Worker Dashboard assets
        run: node scripts/build-dashboard-assets.mjs && test -f dist/dashboard/index.html
      - name: Check Cloudflare Worker syntax
        run: node --check cloudflare/worker.mjs
