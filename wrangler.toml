# Cloudflare Worker: Social & Commerce Cloud API + Dashboard at https://social-api.siamhrbp.com/
# Mirrors the production settings read from the live Worker on 2026-11-22.
# Secrets (BOOTSTRAP_KEY, TOKEN_ENCRYPTION_KEY, META_APP_SECRET, META_WEBHOOK_VERIFY_TOKEN)
# are stored only in Cloudflare and are never committed here.
name = "alpha-centauri-social-api"
main = "cloudflare/worker.mjs"
compatibility_date = "2026-11-18"
workers_dev = false
preview_urls = false

# Keep the plain-text Meta variables that are managed in the Cloudflare dashboard.
keep_vars = true

routes = [
  { pattern = "social-api.siamhrbp.com", custom_domain = true }
]

[build]
command = "node scripts/build-dashboard-assets.mjs"

# Only dist/dashboard/index.html is uploaded. run_worker_first keeps the API router in
# charge of every request; the Worker serves the page only for browser navigations to /.
[assets]
directory = "./dist/dashboard"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "alpha-centauri-social-db"
database_id = "74faedc4-d52a-4595-9ab5-3bc2d7600849"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
